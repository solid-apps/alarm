<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --text: #141a26;
    --text-dim: #6a7688;
    --accent: #0d9e6e;
    --accent-bright: #34d399;
    --accent-2: #059669;
    --card: rgba(255, 255, 255, 0.85);
    --card-border: rgba(17, 24, 39, 0.07);
    --font: -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: var(--font);
    background: linear-gradient(180deg, #f7f8fb 0%, #f2f4f8 60%, #eceff4 100%);
    color: var(--text);
    overflow: hidden;
    position: relative;
  }
  body::before, body::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(120px); pointer-events: none;
  }
  body::before {
    width: 620px; height: 620px; top: -220px; right: -140px;
    background: rgba(16, 185, 129, 0.14);
  }
  body::after {
    width: 560px; height: 560px; bottom: -240px; left: -160px;
    background: rgba(52, 211, 153, 0.20);
  }

  .card {
    position: relative;
    height: 100%;
    padding: 68px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex; align-items: center; gap: 16px;
    font-weight: 650; font-size: 30px; letter-spacing: -0.01em;
  }
  .brand-dot {
    width: 56px; height: 56px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-bright), #059669);
    display: grid; place-items: center; color: #fff;
  }
  .brand-dot svg { width: 31px; height: 31px; }

  .clock {
    font-size: 176px; font-weight: 250; line-height: 1;
    letter-spacing: -0.045em; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #1b2434, #55637a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .clock .ap {
    font-size: 52px; font-weight: 500; letter-spacing: 0;
    -webkit-text-fill-color: var(--text-dim); margin-left: 14px;
  }
  .tagline {
    margin-top: 20px; font-size: 34px; font-weight: 400;
    color: var(--text-dim); letter-spacing: -0.01em;
  }

  .chips { display: flex; align-items: center; gap: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-radius: 999px;
    background: rgba(13, 158, 110, 0.10);
    border: 1px solid rgba(13, 158, 110, 0.28);
    color: var(--accent); font-size: 21px; font-weight: 550;
  }
  .chip svg { width: 19px; height: 19px; }
  .chip.plain {
    background: var(--card); border-color: var(--card-border); color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-dot">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </span>
      Alarm
    </div>

    <div>
      <div class="clock">07:30<span class="ap">AM</span></div>
      <div class="tagline">A simple alarm clock that syncs across your devices.</div>
    </div>

    <div class="chips">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        Stored in your Solid pod
      </span>
      <span class="chip plain">Installable · Open source</span>
    </div>
  </div>
</body>
</html>
